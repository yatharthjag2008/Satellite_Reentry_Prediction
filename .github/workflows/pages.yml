name: website

# Builds the public site (src/build_site.py) from the CelesTrak data and plots
# in the repo and the live forecasts on the forecast-data branch, and publishes
# it with GitHub Pages. The forecasts workflow starts it after every run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: forecast-data
          path: forecast-data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: pip install pandas
      - run: python src/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
