name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - run: pip install -r requirements.txt
      # The NRLMSIS table is generated, not committed; build it so the atmosphere tests run too.
      - run: python src/atmosphere.py
      - run: python -m pytest -q
